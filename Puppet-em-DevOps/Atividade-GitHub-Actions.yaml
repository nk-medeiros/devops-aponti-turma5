# Nome da pipeline que será exibida na aba Actions do GitHub
name: minha-principal


# O bloco "on" define quais eventos irão iniciar a execução da pipeline.
# Esses eventos são chamados de gatilhos (triggers).
on:


  # Gatilho executado quando uma Pull Request é criada,
  # atualizada ou reaberta.
  # É utilizado principalmente em processos de Continuous Integration (CI),
  # pois permite validar o código antes de ser integrado.
  pull_request:

    # Define quais branches aceitam Pull Requests.
    # O uso de padrões facilita a automação conforme o Git Flow.
    branches:
      - main          # Branch principal do projeto
      - developer       # Branch de integração/desenvolvimento
      - feature/**    # Branches de novas funcionalidades


  # Gatilho executado quando ocorre um push no repositório.
  # Pode executar testes, validações e processos de entrega.
  push:

    # Define quais branches irão iniciar a pipeline após um push.
    branches:

      - main          # Código pronto para produção
      - developer       # Código em desenvolvimento
      - feature/**    # Novas funcionalidades


    # Define quais arquivos alterados irão disparar a pipeline.
    # Evita execuções desnecessárias quando arquivos irrelevantes são modificados.
    paths:

      - "testes/*.sh"


    # Também permite executar a pipeline quando uma tag é criada.
    # Tags geralmente representam versões do sistema.
    # Exemplo: vl.1.0, vl.2.0
    tags:

      - "vl.*"



  # Gatilho adicional pesquisado na documentação do GitHub Actions.
  # Permite iniciar a pipeline manualmente pela interface do GitHub.
  # É útil para testes, correções ou execuções controladas.
  workflow_dispatch:



  # Gatilho de execução automática por horário.
  # Utiliza a sintaxe cron para definir quando será executado.
  # Neste exemplo, executa todos os dias às 00:00 UTC.
  # Pode ser utilizado para rotinas de manutenção e testes.
  schedule:

    - cron: "0 0 * * *"



  # Gatilho acionado quando uma Release é criada.
  # Pode ser utilizado em processos de Continuous Delivery (CD),
  # como publicação de versões ou implantação.
  release:

    types:

      - created



  # Gatilho relacionado às Issues do projeto.
  # Permite criar automações quando uma issue é aberta ou encerrada.
  # Pode ser usado para integrar gerenciamento de tarefas com CI/CD.
  issues:

    types:

      - opened
      - closed
